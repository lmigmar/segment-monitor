<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IoT Temperature Monitor</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { margin: 0 auto; border-collapse: collapse; width: 300px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Latest Temperatures</h2>
        <table id="table">
            <tr><th>Time</th><th>Temp</th></tr>
        </table>
    </div>
    <script>
        fetch('readings.json')
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById('table');
                data.forEach(item => {
                    let row = table.insertRow();
                    row.insertCell(0).innerText = item.time;
                    row.insertCell(1).innerText = item.temp + " °C";
                });
            });
    </script>
</body>
</html>
